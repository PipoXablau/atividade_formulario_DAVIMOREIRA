<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>

<body>
    <h1>Página de estudos</h1>
    <form method="get" action="">
        <input type="text" name="nome" placeholder="Digite seu nome:">
        <input type="e-mail" name="email" placeholder="Digite seu e-mail:">
        <input type="submit" value="Enviar">
    </form>

    <form>
        <br>
        <input type="button" value="Clique aqui" onclick="msg()">
    </form>
    <script>
        function msg() {
            alert("Boo!");
        }
    </script>

    <form action="">
        <br>

        <input type="checkbox" name="veiculo1" value="Bicicleta"> Bicicleta <br>
        <input type="checkbox" name="veiculo2" value="Carro"> Carro <br>
        <input type="checkbox" name="veiculo3" value="Moto"> Moto <br>

        Selecione sua cor favorita: <input type="color" name="favcor" value="#B3EBF2"><br>
        <br>
        Data de nascimento: <input type="date" name="nascimento">
        <br>
        <br>
        <input type="file" name="arquivos">
        <br><br>
        <!-- Para permitir a seleção de vários arquivos -->
        <input type="file" name="arquivos" multiple>
        <br>
        <br>
        Quantidade (entre 1 e 5): <input type="number" name="quantidade" min="1" max="5">
        <br>
        <br>
        <input type="password" name="senha" placeholder="Digite sua senha">
        <br>

        <p>Qual sua idade?</p>
        <input type="radio" name="idade" value="18-22">18 e 22 <br>
        <input type="radio" name="idade" value="23-30">23 a 30 <br>
        <input type="radio" name="idade" value="mais31">Acima de 31 <br>

        <br>
        <br>
        Pouco satisfeito
        <input type="range" name="satisfacao" min="0" max="10">
        Muito satisfeito <br>
        <br>
    </form>
    <form>
        <label for="email">Digite seu e-mail:</label>
        <input type="email" id="email" name="email"><br><br>
        <label for="pin">Digite seu código:</label>
        <input type="password" id="pin" name="pin" maxlength="4"><br><br>
        <input type="reset" value="Reset">
        <input type="Submit" value="Submit">
        <br>
        <br>
        <input type="button" value="👍">
        <input type="button" value="👎">
        <br>
        Pesquisar: <input type="search" name="pesquisa">
        <br>
        <br>
        Telefone: <input type="tel" name="telefone" placeholder="(xx) xxxxx-xxxx">
        <br>
        <br>
        Link Website: <input type="url" name="website">
        <br>
        <br>
        <textarea name="mensagem" rows="4" cols="50" placeholder="Digite sua mensagem"></textarea>
        <br>
        <br>
        <select name="Lista" id="lista">
            <option>Selecione uma opção</option>
            <option>Macarrão</option>
            <option>Pizza</option>
            <option>Canelone</option>
        </select>
<hr>
<hr>

        <fieldset>
            <Legend>Formulário</Legend>
            <form action="">
                <input type="text">
            </form>
        </fieldset>
    </form>
</body>

</html>
